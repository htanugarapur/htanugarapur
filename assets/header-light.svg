<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Ruparagunath G header</title>
  <desc id="desc">Personal header for a portfolio site with a clean light theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbf8f3"/>
      <stop offset="100%" stop-color="#efe7dc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#9b7b50"/>
      <stop offset="100%" stop-color="#c9a66b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#b28b54" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)"/>
  <g opacity="0.18">
    <circle cx="1220" cy="70" r="170" fill="#d9b77d"/>
    <circle cx="1280" cy="120" r="110" fill="#e9d2a6"/>
    <circle cx="90" cy="300" r="150" fill="#f0dcc0"/>
  </g>

  <g transform="translate(94 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="170" rx="36" fill="url(#accent)"/>
    <text x="85" y="104" text-anchor="middle" font-size="62" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#f8f4ee" letter-spacing="1">RG</text>
  </g>

  <g transform="translate(330 96)">
    <text x="0" y="0" font-size="64" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1b1d22">Ruparagunath G</text>
    <text x="0" y="62" font-size="27" font-family="Segoe UI, Arial, sans-serif" fill="#4b3822" letter-spacing="0.8">AI Researcher • Neuro-Symbolic &amp; Scientific Machine Learning</text>
    <rect x="0" y="92" width="640" height="4" rx="2" fill="#d1b275"/>
    <text x="0" y="146" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#4a4f5a">Equation Discovery • Explainable AI • Research Infrastructure</text>
  </g>
</svg>
