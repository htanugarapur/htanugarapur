<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Ruparagunath G header</title>
  <desc id="desc">Personal header for a portfolio site with a clean dark theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#101821"/>
      <stop offset="100%" stop-color="#1d2a39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#c8a56b"/>
      <stop offset="100%" stop-color="#9b7b50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)"/>
  <g opacity="0.14">
    <circle cx="1215" cy="75" r="180" fill="#c9a56b"/>
    <circle cx="1285" cy="135" r="120" fill="#d9c59d"/>
    <circle cx="85" cy="300" r="145" fill="#3d4c67"/>
  </g>

  <g transform="translate(94 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="170" rx="36" fill="url(#accent)"/>
    <text x="85" y="104" text-anchor="middle" font-size="62" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#101821" letter-spacing="1">RG</text>
  </g>

  <g transform="translate(330 96)">
    <text x="0" y="0" font-size="64" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ecf2f8">Ruparagunath G</text>
    <text x="0" y="62" font-size="27" font-family="Segoe UI, Arial, sans-serif" fill="#d8dce5" letter-spacing="0.8">AI Researcher • Neuro-Symbolic &amp; Scientific Machine Learning</text>
    <rect x="0" y="92" width="640" height="4" rx="2" fill="#c8a56b"/>
    <text x="0" y="146" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#dfeaf6">Equation Discovery • Explainable AI • Research Infrastructure</text>
  </g>
</svg>
